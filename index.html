<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OJT Notepad</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #181825;
      --card: #1E1E2E;
      --card-alt: #252536;
      --text: #CDD6F4;
      --text-muted: #A6ADC8;
      --accent: #CBA6F7;
      --mint: #A6E3A1;
      --yellow: #F9E2AF;
      --orange: #FAB387;
      --red: #F38BA8;
      --border: #313244;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { height: 100%; background-color: var(--bg); color: var(--text); }
    body { display: flex; justify-content: center; padding: 12px; }
    
    .container { 
      width: 100%; 
      max-width: 380px; 
      height: 100%; 
      display: flex; 
      flex-direction: column; 
    }

    /* Tabs Bar */
    .tabs { 
      display: flex; 
      gap: 4px; 
      background: var(--card); 
      padding: 4px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      border: 1px solid var(--border); 
      shrink: 0;
    }
    .tab-btn { 
      flex: 1; 
      background: transparent; 
      border: none; 
      color: var(--text-muted); 
      padding: 8px 4px; 
      font-size: 0.72rem; 
      font-weight: 700; 
      border-radius: 6px; 
      cursor: pointer; 
      transition: all 0.2s ease;
    }
    .tab-btn.active { background: var(--accent); color: #11111B; }

    /* Tab Content Areas */
    .tab-content { display: none; flex: 1; flex-direction: column; overflow-y: auto; }
    .tab-content.active { display: flex; }

    /* Cards */
    .card { 
      background: var(--card); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 14px; 
      margin-bottom: 10px; 
      text-align: center; 
    }
    .card-alt { background: var(--card-alt); }
    .title { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.5px; }
    .big-num { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin: 6px 0; }
    .eta-text { font-size: 0.85rem; font-weight: 700; color: var(--mint); margin-top: 4px; }

    /* Progress Bar */
    .progress-bar { background: var(--card-alt); height: 10px; border-radius: 5px; overflow: hidden; margin: 8px 0; }
    .progress-fill { background: var(--mint); height: 100%; width: 0%; transition: width 0.3s ease; }
    .progress-sub { font-size: 0.75rem; color: var(--text); }

    /* Grid Buttons */
    .preset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 12px 0; }
    .btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px; font-size: 0.75rem; font-weight: 700; border-radius: 8px; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #11111B; border: none; width: 100%; padding: 12px; margin-top: 10px; font-size: 0.85rem; font-weight: 700; border-radius: 8px; }
    .btn-danger { background: var(--red); color: #11111B; border: none; width: 100%; padding: 10px; font-size: 0.8rem; font-weight: 700; border-radius: 8px; margin-top: auto; }

    /* Custom Input */
    .input-row { display: flex; gap: 8px; margin-top: 8px; }
    .input-group { flex: 1; text-align: left; }
    .input-group label { display: block; font-size: 0.65rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
    input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; font-size: 0.85rem; text-align: center; }
    input[type="date"] { text-align: left; padding: 7px; font-size: 0.8rem; color-scheme: dark; }
    input[type="color"] { height: 36px; padding: 2px; cursor: pointer; }

    /* Calendar Grid */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .cal-legend { display: flex; justify-content: center; gap: 12px; margin-bottom: 10px; font-size: 0.7rem; font-weight: 700; }
    .leg-item { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 0.75rem; }
    .cal-day-name { font-weight: 700; color: var(--text-muted); padding-bottom: 6px; }
    .cal-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: var(--card-alt); border-radius: 6px; font-size: 0.8rem; font-weight: 700; }

    /* Log History Fill Remaining Height */
    .history-card { flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 10px; }
    .log-list { flex: 1; overflow-y: auto; text-align: left; font-family: monospace; font-size: 0.75rem; }
    .log-item { padding: 10px 8px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; cursor: pointer; }
    .log-item.selected { background: var(--card-alt); border-radius: 6px; border: 1px solid var(--accent); }

    /* Settings Sections */
    .settings-group { text-align: left; margin-bottom: 12px; }
    .settings-group h4 { font-size: 0.75rem; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .color-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Tabs Navigation -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('tracker')">Tracker</button>
    <button class="tab-btn" onclick="switchTab('log')">Log Time</button>
    <button class="tab-btn" onclick="switchTab('calendar')">Calendar</button>
    <button class="tab-btn" onclick="switchTab('history')">History</button>
    <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
  </div>

  <!-- TRACKER TAB -->
  <div id="tab-tracker" class="tab-content active">
    <div class="card">
      <div class="title">HOURS REMAINING</div>
      <div class="big-num" id="rem-hours">0h 00m</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-sub" id="progress-text">0h completed (0.0%)</div>
    </div>
    <div class="card card-alt">
      <div class="title">✨ ESTIMATED COMPLETION</div>
      <div class="eta-text" id="eta-text">Calculating...</div>
    </div>
  </div>

  <!-- LOG TIME TAB -->
  <div id="tab-log" class="tab-content">
    <div class="title" style="margin-bottom: 4px;">QUICK PRESETS</div>
    <div class="preset-grid" id="preset-buttons-container"></div>
    <div class="card">
      <div class="input-group" style="margin-bottom: 8px;">
        <label>Log Date</label>
        <input type="date" id="inp-date">
      </div>
      <div class="input-row">
        <div class="input-group"><label>Hours</label><input type="number" id="inp-h" value="8"></div>
        <div class="input-group"><label>Mins</label><input type="number" id="inp-m" value="0"></div>
        <div class="input-group" style="flex:2;"><label>Note</label><input type="text" id="inp-note" value="Daily Shift"></div>
      </div>
      <button class="btn btn-primary" onclick="addLog()">+ Log Worked Hours</button>
    </div>
  </div>

  <!-- CALENDAR TAB -->
  <div id="tab-calendar" class="tab-content">
    <div class="card">
      <div class="cal-header">
        <button class="btn" style="padding: 4px 12px;" onclick="changeMonth(-1)">‹</button>
        <div class="title" id="cal-month-title" style="font-size: 0.85rem;">Month Year</div>
        <button class="btn" style="padding: 4px 12px;" onclick="changeMonth(1)">›</button>
      </div>

      <!-- Legend -->
      <div class="cal-legend">
        <div class="leg-item"><div class="dot" id="leg-dot-full"></div><span style="color:var(--text);">Full</span></div>
        <div class="leg-item"><div class="dot" id="leg-dot-half"></div><span style="color:var(--text);">Half</span></div>
        <div class="leg-item"><div class="dot" id="leg-dot-late"></div><span style="color:var(--text);">Late</span></div>
        <div class="leg-item"><div class="dot" id="leg-dot-off"></div><span style="color:var(--text);">Off</span></div>
      </div>

      <div class="cal-grid" id="cal-grid"></div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" class="tab-content">
    <div class="card history-card">
      <div class="log-list" id="log-list"></div>
    </div>
    <button class="btn btn-danger" onclick="deleteSelectedLog()">Delete Selected Entry</button>
  </div>

  <!-- SETTINGS TAB -->
  <div id="tab-settings" class="tab-content">
    <div class="card">
      <!-- Target Hours -->
      <div class="settings-group">
        <h4>Target Goal Hours</h4>
        <div class="input-group">
          <label>Total Required OJT Hours</label>
          <input type="number" id="set-target-hours" value="480">
        </div>
      </div>

      <!-- Calendar Colors -->
      <div class="settings-group">
        <h4>Calendar Status Colors</h4>
        <div class="color-grid">
          <div class="input-group"><label>Full Day</label><input type="color" id="col-full" value="#A6E3A1"></div>
          <div class="input-group"><label>Half Day</label><input type="color" id="col-half" value="#F9E2AF"></div>
          <div class="input-group"><label>Late Shift</label><input type="color" id="col-late" value="#FAB387"></div>
          <div class="input-group"><label>Absent / Off</label><input type="color" id="col-off" value="#F38BA8"></div>
        </div>
      </div>

      <!-- Presets Config -->
      <div class="settings-group">
        <h4>Preset Configurations</h4>
        <div id="preset-settings-list"></div>
      </div>

      <button class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>
</div>

<script>
  // Default Configurations
  const DEFAULT_SETTINGS = {
    targetHours: 480,
    colors: {
      full: '#A6E3A1',
      half: '#F9E2AF',
      late: '#FAB387',
      off: '#F38BA8'
    },
    presets: [
      { label: 'Full Day (8h)', h: 8, m: 0, note: 'Daily Shift' },
      { label: 'Half Day (4h)', h: 4, m: 0, note: 'Half Day' },
      { label: 'Late (7h 45m)', h: 7, m: 45, note: 'Late 15m' },
      { label: 'Absent / Off (0h)', h: 0, m: 0, note: 'Absent' }
    ]
  };

  let settings = JSON.parse(localStorage.getItem('ojt_settings') || JSON.stringify(DEFAULT_SETTINGS));
  let logs = JSON.parse(localStorage.getItem('ojt_logs') || '[]');
  let selectedLogIdx = null;
  let currYear = new Date().getFullYear();
  let currMonth = new Date().getMonth();

  document.getElementById('inp-date').valueAsDate = new Date();

  function switchTab(name) {
    const tabs = ['tracker', 'log', 'calendar', 'history', 'settings'];
    document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', tabs[i] === name));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${name}`).classList.add('active');
    
    if (name === 'calendar') renderCalendar();
    if (name === 'settings') loadSettingsForm();
  }

  function renderPresets() {
    const container = document.getElementById('preset-buttons-container');
    container.innerHTML = settings.presets.map((p, i) => `
      <button class="btn" ${i === 3 ? 'style="border-color: var(--red); color: var(--red);"' : ''} 
              onclick="setPreset(${p.h}, ${p.m}, '${p.note}')">
        ${p.label}
      </button>
    `).join('');
  }

  function setPreset(h, m, note) {
    document.getElementById('inp-h').value = h;
    document.getElementById('inp-m').value = m;
    document.getElementById('inp-note').value = note;
  }

  function addLog() {
    const h = parseInt(document.getElementById('inp-h').value) || 0;
    const m = parseInt(document.getElementById('inp-m').value) || 0;
    const note = document.getElementById('inp-note').value.trim() || 'Daily Shift';
    
    const dateVal = document.getElementById('inp-date').value;
    let chosenDate = new Date();
    if (dateVal) {
      const parts = dateVal.split('-');
      chosenDate = new Date(parts[0], parts[1] - 1, parts[2]);
    }

    const dateStr = chosenDate.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
    const timeStr = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

    logs.push({ 
      mins: (h * 60) + m, 
      desc: note, 
      date: `${dateStr} - ${timeStr}`,
      rawDate: chosenDate.toISOString()
    });
    
    saveData();
    switchTab('tracker');
  }

  function saveData() {
    localStorage.setItem('ojt_logs', JSON.stringify(logs));
    updateUI();
  }

  function updateUI() {
    const targetMins = (settings.targetHours || 480) * 60;
    const totalMins = logs.reduce((a, b) => a + b.mins, 0);
    const remMins = Math.max(0, targetMins - totalMins);
    
    document.getElementById('rem-hours').innerText = `${Math.floor(remMins/60)}h ${remMins%60}m`;
    const pct = Math.min(100, (totalMins / targetMins) * 100);
    document.getElementById('progress-fill').style.width = `${pct}%`;
    document.getElementById('progress-text').innerText = `${Math.floor(totalMins/60)}h ${totalMins%60}m completed (${pct.toFixed(1)}%)`;

    // Render History
    const listEl = document.getElementById('log-list');
    listEl.innerHTML = logs.map((l, i) => `
      <div class="log-item ${selectedLogIdx === i ? 'selected' : ''}" onclick="selectedLogIdx=${i}; updateUI();">
        <span>+${Math.floor(l.mins/60)}h${l.mins%60}m | ${l.desc}</span>
        <span style="color:var(--text-muted)">${l.date.split(' - ')[0]}</span>
      </div>
    `).join('');

    // ETA Calc
    document.getElementById('eta-text').innerText = remMins <= 0 ? "🎉 Completed!" : getETA(remMins);
    
    // Update Dynamic CSS Colors
    document.getElementById('leg-dot-full').style.background = settings.colors.full;
    document.getElementById('leg-dot-half').style.background = settings.colors.half;
    document.getElementById('leg-dot-late').style.background = settings.colors.late;
    document.getElementById('leg-dot-off').style.background = settings.colors.off;

    renderPresets();
  }

  function getETA(minsLeft) {
    let curr = new Date();
    while (minsLeft > 0) {
      if (curr.getDay() !== 0 && curr.getDay() !== 6) {
        minsLeft -= 480;
      }
      if (minsLeft > 0) curr.setDate(curr.getDate() + 1);
    }
    return curr.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderCalendar() {
    const title = document.getElementById('cal-month-title');
    const grid = document.getElementById('cal-grid');
    const d = new Date(currYear, currMonth, 1);
    title.innerText = d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

    grid.innerHTML = ['M','T','W','T','F','S','S'].map(n => `<div class="cal-day-name">${n}</div>`).join('');
    
    let firstDay = (d.getDay() + 6) % 7;
    let daysInMonth = new Date(currYear, currMonth + 1, 0).getDate();

    const dayMap = {};
    logs.forEach(l => {
      let dt = l.rawDate ? new Date(l.rawDate) : new Date(l.date.split(' - ')[0]);
      if (isNaN(dt.getTime())) {
        const parts = l.date.split(' - ')[0].replace(',', '').split(' ');
        if (parts.length >= 3) dt = new Date(`${parts[0]} ${parts[1]}, ${parts[2]}`);
      }

      if (!isNaN(dt.getTime()) && dt.getFullYear() === currYear && dt.getMonth() === currMonth) {
        let col = settings.colors.full;
        const descLower = l.desc.toLowerCase();
        
        if (l.mins === 0 || descLower.includes('absent') || descLower.includes('suspended') || descLower.includes('off') || descLower.includes('leave')) {
          col = settings.colors.off;
        } else if (l.mins <= 300) {
          col = settings.colors.half;
        } else if (l.mins < 480) {
          col = settings.colors.late;
        }
        dayMap[dt.getDate()] = col;
      }
    });

    for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
    for (let day = 1; day <= daysInMonth; day++) {
      let customBg = dayMap[day] ? `background:${dayMap[day]} !important; color:#11111B !important;` : '';
      grid.innerHTML += `<div class="cal-cell" style="${customBg}">${day}</div>`;
    }
  }

  function changeMonth(delta) {
    currMonth += delta;
    if (currMonth > 11) { currMonth = 0; currYear++; }
    if (currMonth < 0) { currMonth = 11; currYear--; }
    renderCalendar();
  }

  function deleteSelectedLog() {
    if (selectedLogIdx !== null) {
      logs.splice(selectedLogIdx, 1);
      selectedLogIdx = null;
      saveData();
    }
  }

  /* SETTINGS TAB FUNCTIONS */
  function loadSettingsForm() {
    document.getElementById('set-target-hours').value = settings.targetHours || 480;
    document.getElementById('col-full').value = settings.colors.full;
    document.getElementById('col-half').value = settings.colors.half;
    document.getElementById('col-late').value = settings.colors.late;
    document.getElementById('col-off').value = settings.colors.off;

    const list = document.getElementById('preset-settings-list');
    list.innerHTML = settings.presets.map((p, i) => `
      <div style="background:var(--card-alt); padding:8px; border-radius:8px; margin-bottom:8px;">
        <div class="input-group" style="margin-bottom:4px;">
          <label>Button Label #${i+1}</label>
          <input type="text" id="set-p-label-${i}" value="${p.label}">
        </div>
        <div class="input-row">
          <div class="input-group"><label>Hrs</label><input type="number" id="set-p-h-${i}" value="${p.h}"></div>
          <div class="input-group"><label>Mins</label><input type="number" id="set-p-m-${i}" value="${p.m}"></div>
          <div class="input-group" style="flex:2;"><label>Note</label><input type="text" id="set-p-note-${i}" value="${p.note}"></div>
        </div>
      </div>
    `).join('');
  }

  function saveSettings() {
    settings.targetHours = parseInt(document.getElementById('set-target-hours').value) || 480;
    settings.colors = {
      full: document.getElementById('col-full').value,
      half: document.getElementById('col-half').value,
      late: document.getElementById('col-late').value,
      off: document.getElementById('col-off').value
    };

    settings.presets = settings.presets.map((_, i) => ({
      label: document.getElementById(`set-p-label-${i}`).value,
      h: parseInt(document.getElementById(`set-p-h-${i}`).value) || 0,
      m: parseInt(document.getElementById(`set-p-m-${i}`).value) || 0,
      note: document.getElementById(`set-p-note-${i}`).value
    }));

    localStorage.setItem('ojt_settings', JSON.stringify(settings));
    updateUI();
    alert('Settings Saved Successfully!');
    switchTab('tracker');
  }

  updateUI();
</script>
</body>
</html>
